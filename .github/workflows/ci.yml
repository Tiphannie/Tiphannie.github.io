name: CI Pipeline

on:
  push:
    branches:
      - LAB-08
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: sample-next/my-app

      - name: Build project
        run: npm run build
        working-directory: sample-next/my-app

  systemtest:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: sample-next/my-app

      - name: Run system tests
        run: npm test
        working-directory: sample-next/my-app
